<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../index.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <title>Dashboard</title>
  </head>
  <body>
    <div class="container">
      <h1 id="logo">PinBoard</h1>
    </div>

    <nav class="container" aria-label="Navegación principal">
      <ul role="list">
        <a href="../index.html">
          <img src="../assets/svg/home_24dp_E3E3E3.svg" alt="home" />
          <p>Home</p>
        </a>
        <a href="/explore">
          <img src="../assets/svg/explore_24dp_E3E3E3.svg" alt="explore" />
          <p>Explore</p>
        </a>
        <a href="/add">
          <img
            src="../assets/svg/add_circle_outline_24dp_E3E3E3.svg"
            alt="add"
          />
          <p>Add</p>
        </a>
        <a href="./Dashboard.html" aria-current="page">
          <img
            src="../assets/svg/space_dashboard_24dp_E3E3E3.svg"
            alt="your dashboard"
          />
          <p>Dashboard</p>
        </a>
      </ul>
    </nav>

    <template id="pin-template">
      <article class="pin">
        <img class="pin-image" src="" alt="" />
      </article>
    </template>

    <main id="pin-container">
      <div id="profile-data" class="profile-data">
        <img id="profile-icon" alt="User icon" />
        <div>
          <p id="profile-followers"></p>
          <p id="profile-following"></p>
          <h2 id="profile-username"></h2>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Pins">
        <button class="tab" id="tab-created" role="tab" aria-selected="true">
          Created
        </button>
        <button class="tab" id="tab-saved" role="tab" aria-selected="false">
          Saved
        </button>
      </div>

      <div class="pin-gallery"></div>
    </main>

    <footer class="container" id="userData">
      <img id="user-icon" alt="User icon" />
      <p id="username"></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/dashboard.js"></script>
  </body>
</html>
